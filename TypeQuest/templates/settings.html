{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">MAKE IT YOURS</div><h1>App <span class="gradient-text">settings.</span></h1><p class="muted">Tune the experience to match your focus.</p></div></div><div class="panel settings-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Color theme</label><select class="form-select tq-input mb-4" name="theme"><option value="dark" {{ 'selected' if setting.theme=='dark' }}>Dark</option><option value="light" {{ 'selected' if setting.theme=='light' }}>Light</option><option value="amoled" {{ 'selected' if setting.theme=='amoled' }}>AMOLED</option><option value="blue" {{ 'selected' if setting.theme=='blue' }}>Blue neon</option></select><label>Typing font size</label><input class="form-range mb-4" type="range" min="14" max="26" name="font_size" value="{{ setting.font_size }}"><div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" name="sound" id="sound" {{ 'checked' if setting.sound }}><label class="form-check-label" for="sound">Enable keypress sound</label></div><button class="btn btn-primary">Save preferences</button></form></div>{% endblock %}
